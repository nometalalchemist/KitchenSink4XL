name: "🔧 Bug report"
description: "Something glitched, refused, or came back with the wrong number"
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! One important note before you start:
        **never attach a private workbook.** If the bug needs a workbook to
        reproduce, rebuild the structure with placeholder data.

        Before filing: ask your AI to run `get_server_info` and paste the
        output here; it is designed to be safe to share.
  - type: input
    id: tool
    attributes:
      label: Which tool?
      placeholder: "e.g. modify_grid_structure, query_range, recalculate"
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: The exact tool call
      description: The arguments you passed (redact any private paths/text).
      render: json
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The response or error you got, verbatim if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: label
    attributes:
      label: If a value came back wrong, what label did it carry?
      description: >
        Reads mark every value calculated, cached, or absent. The label is
        half the diagnosis, so copy it in if you have it.
      placeholder: "calculated / cached / absent / no label shown"
  - type: textarea
    id: workbookshape
    attributes:
      label: Workbook characteristics
      description: >
        What's in the workbook near the failure? (merged cells, tables,
        pivots, slicers, conditional formatting, external links, defined
        names, array formulas, which app created it...)
  - type: input
    id: version
    attributes:
      label: KitchenSink4XL version
      placeholder: "pip show kitchensink4xl"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.12, Excel 365 (com pack only)"
  - type: input
    id: packs
    attributes:
      label: Which packs were enabled?
      placeholder: "lite only / lite + design / KS4XL_MODE=full"
